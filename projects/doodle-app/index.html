<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Doodle Studio</title><style>body{font-family:Arial;margin:0;background:#f5f0e8;color:#111827}.wrap{max-width:980px;margin:auto;padding:28px}.app{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.paper{background:white;border:1px solid #ddd;border-radius:14px;box-shadow:0 18px 35px #d7cec1;padding:20px}canvas{background:white;border-radius:12px;border:1px solid #ddd;display:block;margin:auto}.panel{background:white;border:1px solid #d6ccc2;border-radius:12px;padding:18px;margin-bottom:14px}button,a{padding:10px 14px;border:0;border-radius:8px;background:#2a9d8f;color:white;font-weight:bold;text-decoration:none;margin:4px;display:inline-block}.bar{height:10px;background:#e5e7eb;border-radius:10px;margin:8px 0}.fill{height:10px;background:#2a9d8f;border-radius:10px}@media(max-width:800px){.app{grid-template-columns:1fr}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script></head><body><main class="wrap"><a href="../../">Back to portfolio</a><h1>AI Doodle Studio</h1><p>Draw one simple object. This version demonstrates the drawing interface, tools, and prediction display used in the Doodle App assignment.</p><div class="app"><div class="paper" id="canvasWrap"></div><aside><div class="panel"><strong>AI guess: rain</strong><p>Confidence: 26.1%</p><p>Rain</p><div class="bar"><div class="fill" style="width:26%"></div></div><p>Snowflake</p><div class="bar"><div class="fill" style="width:17%"></div></div><p>Stitches</p><div class="bar"><div class="fill" style="width:16%"></div></div></div><div class="panel"><h2>Drawing Tools</h2><button onclick="mode='pen'">Black Pen</button><button onclick="mode='marker'">Marker</button><button onclick="mode='eraser'">Eraser</button><button onclick="clearCanvas()">Clear</button><button onclick="saveCanvas(c,'doodle','png')">Save</button><p>Mode: <span id="m">pen</span></p></div></aside></div></main><script>let c,mode='pen';function setup(){c=createCanvas(500,500);c.parent('canvasWrap');background(255);strokeWeight(12)}function draw(){document.getElementById('m').textContent=mode;if(mouseIsPressed&&mouseX>=0&&mouseX<=width&&mouseY>=0&&mouseY<=height){stroke(mode==='eraser'?255:mode==='marker'?'#2a9d8f':'#000');strokeWeight(mode==='marker'?20:mode==='eraser'?24:10);line(mouseX,mouseY,pmouseX,pmouseY)}}function clearCanvas(){background(255)}</script></body></html>
